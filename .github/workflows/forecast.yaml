name: Forecast bot

on:
  schedule:
    - cron: "4,24,44 * * * *" # every 20 minutes; questions stay open for about 3 hours
  workflow_dispatch:
    inputs:
      mode:
        description: "test = Metaculus bot testing area (unscored, safe). live = real tournaments."
        required: true
        default: test
        type: choice
        options:
          - test
          - live

permissions:
  contents: write # lets the bot commit its run log (logs/forecasts.csv)

concurrency:
  group: forecast-bot
  cancel-in-progress: false

jobs:
  forecast:
    # Scheduled runs only start after the repository variable BOT_ENABLED is set to true.
    if: github.event_name == 'workflow_dispatch' || vars.BOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2

      - name: Run forecasting bot
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BOT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
          TOURNAMENTS: ${{ vars.TOURNAMENTS }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          NUM_RUNS_PER_QUESTION: ${{ vars.NUM_RUNS_PER_QUESTION }}
          MAX_QUESTIONS_PER_DAY: ${{ vars.MAX_QUESTIONS_PER_DAY }}
          AUTO_DISCOVER_TOURNAMENTS: ${{ vars.AUTO_DISCOVER_TOURNAMENTS }}
        run: python bot.py

      - name: Save run log
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- logs)" ]; then
            git config user.name "${{ github.repository_owner }}"
            git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
            git add logs
            git commit -m "Update forecast log"
            git pull --rebase --autostash || true
            git push || echo "Could not push the log this time"
          fi
